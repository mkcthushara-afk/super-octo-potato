name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Online address of Site Bill Book, e.g. https://site-bill-book.onrender.com"
        required: true
      version_name:
        description: "Version shown on the phone"
        required: true
        default: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: >
          gradle -p android assembleRelease --no-daemon
          -PappUrl="${{ inputs.app_url }}"
          -PversionName="${{ inputs.version_name }}"
          -PversionCode="${{ github.run_number }}"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "SiteBillBook-${{ inputs.version_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBillBook-${{ inputs.version_name }}
          path: SiteBillBook-${{ inputs.version_name }}.apk
